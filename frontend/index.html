<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiveMind - Join the Collective Intelligence</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .achievement-popup { animation: popup 0.5s ease-out; }
        @keyframes popup { from {transform: scale(0);} to {transform: scale(1);} }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% {box-shadow: 0 0 0 0 rgba(66, 153, 225, 0.7);} 70% {box-shadow: 0 0 0 10px rgba(66, 153, 225, 0);} 100% {box-shadow: 0 0 0 0 rgba(66, 153, 225, 0);} }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <nav class="fixed top-0 w-full bg-gray-800 shadow-lg z-50">
        <div class="container mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center">
                <img src="/assets/hive-logo.svg" class="h-8 w-8 mr-2">
                <span class="text-xl font-bold">HiveMind</span>
            </div>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <span class="text-2xl">🏆</span>
                    <span id="points" class="absolute -top-2 -right-2 bg-yellow-500 rounded-full px-2 py-1 text-xs">0</span>
                </div>
                <div class="relative">
                    <button id="streak-btn" class="pulse bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg">
                        🔥 <span id="streak-count">0</span> Day Streak
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 pt-24">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-gray-800 rounded-xl p-6 shadow-xl">
                <h2 class="text-2xl font-bold mb-4">Live Hive Activity</h2>
                <div id="activity-feed" class="space-y-4 h-96 overflow-y-auto">
                    <!-- Dynamic activity items -->
                </div>
            </div>

            <div class="bg-gray-800 rounded-xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Your Impact</h2>
                    <button onclick="shareAchievements()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg flex items-center">
                        🌟 Share Progress
                    </button>
                </div>
                <div id="achievements" class="grid grid-cols-3 gap-4">
                    <!-- Achievement badges -->
                </div>
            </div>
        </div>

        <div class="mt-8 bg-gray-800 rounded-xl p-6 shadow-xl">
            <h2 class="text-2xl font-bold mb-4">Global Leaderboard</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-gradient-to-r from-yellow-400 to-yellow-600 rounded-lg p-4">
                    <h3 class="text-xl font-bold">🥇 First Place</h3>
                    <div id="first-place" class="mt-2"></div>
                </div>
                <!-- Other leaderboard positions -->
            </div>
        </div>
    </main>

    <div id="achievement-popup" class="fixed bottom-4 right-4 hidden achievement-popup bg-green-500 text-white p-4 rounded-lg shadow-xl">
        🎉 New Achievement Unlocked!
    </div>

    <script>
        // Gamification mechanics
        let points = 0;
        let streak = 0;
        
        function updatePoints(amount) {
            points += amount;
            document.getElementById('points').textContent = points;
            checkAchievements();
        }

        function checkAchievements() {
            if(points >= 100) showAchievement('First Century! 🎯');
            if(streak >= 7) showAchievement('Week Warrior! 🗡️');
        }

        function showAchievement(text) {
            const popup = document.getElementById('achievement-popup');
            popup.textContent = `🎉 Achievement Unlocked: ${text}`;
            popup.classList.remove('hidden');
            setTimeout(() => popup.classList.add('hidden'), 3000);
        }

        function shareAchievements() {
            const text = `🚀 I've earned ${points} points on HiveMind with a ${streak}-day streak! Join the collective intelligence revolution! #HiveMind #CollectiveIntelligence`;
            if (navigator.share) {
                navigator.share({
                    title: 'My HiveMind Achievements',
                    text: text,
                    url: window.location.href
                });
            }
        }

        // Simulate real-time activity
        setInterval(() => {
            const activities = [
                '🧠 Alice just solved a complex problem',
                '🌟 Bob earned the "Genius" badge',
                '🚀 Carol contributed to a breakthrough'
            ];
            const feed = document.getElementById('activity-feed');
            const div = document.createElement('div');
            div.className = 'bg-gray-700 p-3 rounded-lg';
            div.textContent = activities[Math.floor(Math.random() * activities.length)];
            feed.prepend(div);
            if(feed.children.length > 10) feed.lastChild.remove();
        }, 3000);

        // Initialize with some random data
        updatePoints(Math.floor(Math.random() * 50));
        streak = Math.floor(Math.random() * 5);
        document.getElementById('streak-count').textContent = streak;
    </script>
</body>
</html>
