<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiveMind - Join the Collective Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: #0a0a2a;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .hive-stats {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .contribution-graph {
            background: rgba(0,255,0,0.1);
            height: 200px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        .achievement-banner {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            padding: 15px;
            border-radius: 10px;
            animation: slideIn 0.5s ease-out;
        }
        .hive-rank {
            font-size: 24px;
            color: #FFD700;
            text-align: center;
            margin: 20px 0;
        }
        .swarm-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,255,0,0.2) 0%, rgba(0,0,0,0) 70%);
            animation: pulse 2s infinite;
        }
        .leaderboard {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
        }
        .user-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            background: linear-gradient(45deg, #4CAF50, #2196F3);
            margin: 5px;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.6; }
        }
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐝 HiveMind Collective</h1>
        
        <div class="hive-stats">
            <div>👥 Active Minds: <span id="active-users">2,847</span></div>
            <div>🧠 Collective IQ: <span id="collective-iq">184</span></div>
            <div>⚡ Swarm Power: <span id="swarm-power">67%</span></div>
        </div>

        <div class="hive-rank">
            🏆 Your Hive Rank: Grand Neural Node
            <div class="user-badge">Level 42</div>
        </div>

        <div class="contribution-graph">
            <div class="swarm-pulse"></div>
            <!-- Dynamic visualization of user contributions -->
        </div>

        <div class="leaderboard">
            <h2>🌟 Top Contributors</h2>
            <div id="top-minds">
                <!-- Dynamically populated -->
            </div>
        </div>

        <div class="achievement-banner" id="achievement" style="display:none">
            🎉 Achievement Unlocked: "Hive Explorer"!
        </div>
    </div>

    <script>
        // Gamification mechanics
        let userScore = 0;
        let achievements = [];

        function updateStats() {
            const activeUsers = document.getElementById('active-users');
            const collectiveIq = document.getElementById('collective-iq');
            const swarmPower = document.getElementById('swarm-power');
            
            // Create FOMO by showing numbers changing in real-time
            setInterval(() => {
                activeUsers.textContent = (2800 + Math.floor(Math.random() * 200)).toLocaleString();
                collectiveIq.textContent = (180 + Math.floor(Math.random() * 8));
                swarmPower.textContent = (65 + Math.floor(Math.random() * 5)) + '%';
            }, 3000);
        }

        function unlockAchievement(name) {
            const banner = document.getElementById('achievement');
            banner.style.display = 'block';
            banner.textContent = `🎉 Achievement Unlocked: "${name}"!`;
            setTimeout(() => banner.style.display = 'none', 3000);
        }

        // Social proof and competition
        function updateLeaderboard() {
            const topMinds = document.getElementById('top-minds');
            const leaders = [
                {name: 'NeuralNinja', score: 2847},
                {name: 'SwarmSage', score: 2533},
                {name: 'HiveMaster', score: 2312}
            ];
            
            topMinds.innerHTML = leaders.map((leader, i) => 
                `<div class="user-badge">${i+1}. ${leader.name} - ${leader.score}🔥</div>`
            ).join('');
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            updateLeaderboard();
            
            // Trigger achievements randomly to keep users engaged
            setInterval(() => {
                if(Math.random() > 0.7) {
                    unlockAchievement(['Mind Melding Master', 'Swarm Synchronizer', 'Neural Network Nexus'][Math.floor(Math.random() * 3)]);
                }
            }, 45000);
        });
    </script>
</body>
</html>
