<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiveMind - Swarm Intelligence Platform</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --dark: #292F36;
            --light: #F7F7F7;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .swarm-visualization {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            min-height: 400px;
            overflow: hidden;
        }

        .agent {
            width: 20px;
            height: 20px;
            background: var(--secondary);
            border-radius: 50%;
            position: absolute;
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .agent:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px var(--secondary);
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .metric-card {
            background: rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
        }

        .metric-value {
            font-size: 2rem;
            color: var(--primary);
            margin: 1rem 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">HiveMind</div>
            <nav>
                <button onclick="toggleSimulation()" id="sim-toggle" 
                    style="padding: 0.5rem 1rem; background: var(--primary); border: none; 
                    color: white; border-radius: 5px; cursor: pointer;">
                    Start Simulation
                </button>
            </nav>
        </header>

        <div class="swarm-visualization" id="swarm-container"></div>

        <div class="metrics">
            <div class="metric-card">
                <h3>Active Agents</h3>
                <div class="metric-value" id="agent-count">0</div>
            </div>
            <div class="metric-card">
                <h3>Swarm Efficiency</h3>
                <div class="metric-value" id="efficiency">0%</div>
            </div>
            <div class="metric-card">
                <h3>Tasks Completed</h3>
                <div class="metric-value" id="tasks">0</div>
            </div>
        </div>
    </div>

    <script>
        let agents = [];
        let isSimulationRunning = false;
        let taskCount = 0;

        function createAgent() {
            const agent = document.createElement('div');
            agent.className = 'agent';
            agent.style.left = Math.random() * 90 + '%';
            agent.style.top = Math.random() * 90 + '%';
            document.getElementById('swarm-container').appendChild(agent);
            agents.push(agent);
            updateMetrics();
        }

        function moveAgents() {
            if (!isSimulationRunning) return;

            agents.forEach(agent => {
                const newX = Math.random() * 90;
                const newY = Math.random() * 90;
                agent.style.left = newX + '%';
                agent.style.top = newY + '%';

                if (Math.random() > 0.9) {
                    taskCount++;
                    agent.style.animation = 'pulse 0.5s';
                    setTimeout(() => agent.style.animation = '', 500);
                }
            });

            updateMetrics();
            setTimeout(moveAgents, 2000);
        }

        function updateMetrics() {
            document.getElementById('agent-count').textContent = agents.length;
            document.getElementById('efficiency').textContent = 
                Math.round((taskCount / (agents.length || 1)) * 100) + '%';
            document.getElementById('tasks').textContent = taskCount;
        }

        function toggleSimulation() {
            isSimulationRunning = !isSimulationRunning;
            const btn = document.getElementById('sim-toggle');
            btn.textContent = isSimulationRunning ? 'Stop Simulation' : 'Start Simulation';
            btn.style.background = isSimulationRunning ? 'var(--secondary)' : 'var(--primary)';

            if (isSimulationRunning) {
                moveAgents();
                const interval = setInterval(() => {
                    if (!isSimulationRunning) {
                        clearInterval(interval);
                        return;
                    }
                    if (agents.length < 20) createAgent();
                }, 1000);
            }
        }

        // Initial agents
        for (let i = 0; i < 5; i++) createAgent();
    </script>
</body>
</html>
